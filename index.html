<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#18232d">
<title>Memo Cards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#202b36;--muted:#78838d;--paper:#f7f3ee;--white:#fff;--accent:#ed7b42;--line:#e8e2dc;--green:#259b69;--red:#d95b58}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:620px;min-height:100dvh;margin:auto;background:var(--paper);display:flex;flex-direction:column}
.top{height:58px;background:#18232d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:2}
.brand{font-weight:700;letter-spacing:.2px}.top small{color:#aab4bf;font-size:12px}
main{flex:1;padding:24px 18px 100px}.page-title{font-size:27px;font-weight:750;margin:2px 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.primary{background:var(--accent);color:white;padding:13px 17px;border-radius:13px;font-weight:650}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:12px 15px;border-radius:12px;font-weight:600}
.danger{color:var(--red);background:#fff0ef;border:1px solid #f4d5d2;padding:10px 13px;border-radius:11px}
.deck-list{display:grid;gap:12px}.deck{background:#fff;border-radius:17px;padding:17px;box-shadow:0 2px 10px #1d29300a;display:flex;gap:12px;align-items:center}
.deck-main{flex:1;min-width:0}.deck-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}.deck-meta{font-size:13px;color:var(--muted);margin-top:5px}
.deck-actions{display:flex;gap:6px}.icon-btn{width:37px;height:37px;border-radius:11px;background:#f5f3f1;color:#69737d;font-size:18px}
.empty{border:1.5px dashed #d8d0c8;border-radius:17px;padding:28px 18px;text-align:center;color:var(--muted);line-height:1.5}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:#fff;color:#7b858d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}
.tab span:first-child{font-size:23px}.tab.active{color:var(--accent);font-weight:700}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 22px #18232d0c}
.training-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.training-head strong{font-size:15px}.counter{font-size:13px;color:var(--muted)}
.flashcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #18232d12;min-height:360px;display:flex;flex-direction:column;cursor:pointer;user-select:none;border:1px solid #eee8e1}
.flash-image{width:100%;height:220px;object-fit:cover;background:#eee8e1;display:block}
.no-image{height:145px;background:linear-gradient(135deg,#eee8e1,#e2d9cf);display:flex;align-items:center;justify-content:center;color:#a49a90;font-size:46px}
.flash-copy{padding:25px 22px 28px;text-align:center;display:flex;flex:1;flex-direction:column;justify-content:center;gap:10px}
.flash-label{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#9a928a;font-weight:700}
.flash-text{font-size:25px;font-weight:750;line-height:1.3;overflow-wrap:anywhere}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:15px 0 18px}
.answer{background:#f4f0eb;border-radius:16px;padding:18px;text-align:center;margin-top:14px}
.answer .flash-text{font-size:24px;color:#236f55}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.correct{background:#249b6b;color:#fff;border-radius:13px;padding:15px 10px;font-weight:700}
.wrong{background:#fff;color:#c84e4b;border:1px solid #edc7c4;border-radius:13px;padding:15px 10px;font-weight:700}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.form{display:grid;gap:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#5e6871}
input,textarea{width:100%;border:1px solid #ded8d1;border-radius:12px;padding:13px;background:#fff;color:var(--ink);outline:none}
textarea{min-height:85px;resize:vertical}input:focus,textarea:focus{border-color:var(--accent)}
.modal-back{position:fixed;inset:0;background:#10182099;z-index:10;display:none;align-items:flex-end;justify-content:center}
.modal-back.show{display:flex}.modal{background:var(--paper);width:min(620px,100%);max-height:90dvh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:21px;margin:0}
.preview{width:100%;max-height:170px;object-fit:cover;border-radius:12px;display:none;margin-top:9px}
.card-item{background:#fff;border-radius:13px;padding:13px;margin-top:9px;display:flex;align-items:center;gap:10px}
.card-thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#eee}.card-desc{flex:1;min-width:0}.card-desc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-desc small{color:var(--muted)}
.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);line-height:1.4}.spacer{height:12px}
@media(min-width:560px){main{padding-left:25px;padding-right:25px}.modal-back{align-items:center}.modal{border-radius:22px;margin:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Memo Cards</div><small>Твои идеи и знания</small></header>
<main id="main"></main>
<nav class="bottom">
<button class="tab active" id="tab-training" onclick="showTab('training')"><span>ϟ</span><span>Тренировка</span></button>
<button class="tab" id="tab-decks" onclick="showTab('decks')"><span>▱</span><span>Колоды</span></button>
</nav>
</div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modal"></div>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#18232d');tg.setBackgroundColor('#f7f3ee')}catch(e){}}
const KEY='memo_cards_v1';
let data=load(),tab='decks',activeDeckId=null,flipped=false,stats={right:0,wrong:0};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{decks:[],lastDeckId:null}}catch(e){return{decks:[],lastDeckId:null}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function deckById(id){return data.decks.find(d=>d.id===id)}
function showTab(t){tab=t;document.getElementById('tab-training').classList.toggle('active',t==='training');document.getElementById('tab-decks').classList.toggle('active',t==='decks');render()}
function render(){if(tab==='decks')renderDecks();else renderTraining()}
function renderDecks(){
 const main=document.getElementById('main');
 main.innerHTML=`<div class="page-title">Мои колоды</div><div class="sub">Создавай наборы карточек и запоминай важное</div><div style="margin-bottom:17px"><button class="primary" onclick="openDeckForm()">＋ Создать колоду</button></div><div class="deck-list" id="deckList"></div>`;
 const list=document.getElementById('deckList');
 if(!data.decks.length){list.innerHTML='<div class="empty">Пока нет ни одной колоды.<br>Создай первую — это займёт минуту.</div>';return}
 list.innerHTML=data.decks.map(d=>`<div class="deck"><div class="deck-main" onclick="startDeck('${d.id}')" style="cursor:pointer"><div class="deck-name">${esc(d.name)}</div><div class="deck-meta">${d.cards.length} карточек</div></div><div class="deck-actions"><button class="icon-btn" title="Редактировать" onclick="openDeckForm('${d.id}')">✎</button><button class="icon-btn" title="Удалить" onclick="deleteDeck('${d.id}')">×</button></div></div>`).join('');
}
function renderTraining(){
 const main=document.getElementById('main'),d=deckById(data.lastDeckId);
 if(!d){main.innerHTML=`<div class="page-title">Тренировка</div><div class="sub">Повторяй карточки, чтобы лучше запоминать</div><div class="empty">Сначала создай колоду во вкладке «Колоды».<div class="spacer"></div><button class="primary" onclick="showTab('decks')">Перейти к колодам</button></div>`;return}
 activeDeckId=d.id;
 if(!d.cards.length){main.innerHTML=`<div class="page-title">Тренировка</div><div class="sub">${esc(d.name)}</div><div class="empty">В этой колоде пока нет карточек.<div class="spacer"></div><button class="primary" onclick="openCardForm('${d.id}')">＋ Добавить карточку</button></div>`;return}
 if(!d.cards[0])return;
 const c=d.cards[0];
 main.innerHTML=`<div class="training-head"><div><div class="page-title" style="font-size:23px">Тренировка</div><div class="sub" style="margin:4px 0 0">${esc(d.name)}</div></div><div class="counter">${d.cards.length} в очереди</div></div>
 <div class="flashcard" onclick="flipCard()">
 ${c.image?`<img class="flash-image" src="${c.image}" alt="">`:`<div class="no-image">✦</div>`}
 <div class="flash-copy"><div class="flash-label">${flipped?'Правильный ответ':'Вспомни перевод'}</div><div class="flash-text">${esc(flipped?c.answer:c.front)}</div></div>
 </div>
 <div class="hint">${flipped?'Нажми кнопку ниже, чтобы оценить ответ':'Нажми на карточку, чтобы увидеть ответ'}</div>
 ${flipped?`<div class="actions"><button class="correct" onclick="rateCard(true)">✓ Перевёл верно</button><button class="wrong" onclick="rateCard(false)">↻ Перевёл неверно</button></div>`:''}
 <div class="row" style="margin-top:20px"><button class="secondary" onclick="openCardForm('${d.id}','${c.id}')">Изменить карточку</button><button class="secondary" onclick="showTab('decks')">Все колоды</button></div>
 <div class="hint">За эту тренировку: верно ${stats.right} · неверно ${stats.wrong}</div>`;
}
function flipCard(){if(!flipped){flipped=true;renderTraining()}}
function rateCard(ok){
 const d=deckById(activeDeckId);if(!d||!d.cards.length)return;
 const c=d.cards.shift();
 if(ok){d.cards.push(c);stats.right++}
 else{stats.wrong++;const max=Math.min(3,d.cards.length);const pos=Math.floor(Math.random()*(max+1));d.cards.splice(pos,0,c)}
 save();flipped=false;renderTraining();
}
function startDeck(id){data.lastDeckId=id;save();stats={right:0,wrong:0};flipped=false;showTab('training')}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openDeckForm(id){
 const d=id?deckById(id):null;
 openModal(`<div class="modal-head"><h2>${d?'Редактировать колоду':'Новая колода'}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
 <form class="form" onsubmit="saveDeck(event,'${id||''}')"><div class="field"><label>Название колоды</label><input id="deckName" maxlength="80" required placeholder="Например: 20 популярных фраз на английском" value="${esc(d?.name||'')}"></div><button class="primary" type="submit">${d?'Сохранить':'Создать колоду'}</button></form>
 ${d?`<div class="spacer"></div><div class="row"><button class="secondary" onclick="openCardForm('${d.id}')">＋ Добавить карточку</button><button class="secondary" onclick="showDeckCards('${d.id}')">Карточки (${d.cards.length})</button></div>`:''}`);
}
function saveDeck(e,id){e.preventDefault();const name=document.getElementById('deckName').value.trim();if(!name)return;
 if(id){deckById(id).name=name}else{const d={id:uid(),name,cards:[]};data.decks.push(d);data.lastDeckId=d.id}
 save();closeModal();renderDecks()}
function deleteDeck(id){const d=deckById(id);if(!d)return;if(!confirm(`Удалить колоду «${d.name}» и все её карточки?`))return;data.decks=data.decks.filter(x=>x.id!==id);if(data.lastDeckId===id)data.lastDeckId=data.decks[0]?.id||null;save();renderDecks()}
function showDeckCards(id){
 const d=deckById(id);if(!d)return;
 openModal(`<div class="modal-head"><h2>${esc(d.name)}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
 <button class="primary" onclick="openCardForm('${id}')">＋ Добавить карточку</button><div id="cardList" style="margin-top:12px">${d.cards.length?d.cards.map(c=>`<div class="card-item">${c.image?`<img class="card-thumb" src="${c.image}">`:'<div class="card-thumb" style="display:grid;place-items:center">✦</div>'}<div class="card-desc"><b>${esc(c.front)}</b><small>${esc(c.answer)}</small></div><button class="icon-btn" onclick="openCardForm('${id}','${c.id}')">✎</button><button class="icon-btn" onclick="deleteCard('${id}','${c.id}')">×</button></div>`).join(''):'<div class="empty" style="margin-top:12px">Карточек пока нет</div>'}</div>`);
}
function openCardForm(deckId,cardId){
 const d=deckById(deckId),c=cardId?d.cards.find(x=>x.id===cardId):null;
 openModal(`<div class="modal-head"><h2>${c?'Изменить карточку':'Новая карточка'}</h2><button class="icon-btn" onclick="${c?`showDeckCards('${deckId}')`:'closeModal()'}">×</button></div>
 <form class="form" onsubmit="saveCard(event,'${deckId}','${cardId||''}')">
 <div class="field"><label>Фраза, которую нужно вспомнить (например, по-русски)</label><textarea id="frontText" maxlength="500" required placeholder="Как дела?">${esc(c?.front||'')}</textarea></div>
 <div class="field"><label>Правильный ответ (например, на английском)</label><textarea id="answerText" maxlength="500" required placeholder="How are you?">${esc(c?.answer||'')}</textarea></div>
 <div class="field"><label>Фотография — необязательно</label><input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)"><img id="imagePreview" class="preview" ${c?.image?`src="${c.image}" style="display:block"`:''}><button type="button" class="secondary" id="removeImage" onclick="clearImage()" ${c?.image?'':'style="display:none"'}>Убрать фотографию</button><div class="notice">Фото автоматически уменьшается, чтобы не занимать много места.</div></div>
 <button class="primary" type="submit">${c?'Сохранить карточку':'Добавить карточку'}</button></form>`);
 window.currentImage=c?.image||'';
}
function previewImage(e){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Выбери изображение.');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);window.currentImage=canvas.toDataURL('image/jpeg',.78);const p=document.getElementById('imagePreview');p.src=window.currentImage;p.style.display='block';document.getElementById('removeImage').style.display='inline-block'};img.src=reader.result};reader.readAsDataURL(file)}
function clearImage(){window.currentImage='';document.getElementById('imagePreview').style.display='none';document.getElementById('removeImage').style.display='none';document.getElementById('imageFile').value=''}
function saveCard(e,deckId,cardId){e.preventDefault();const d=deckById(deckId),front=document.getElementById('frontText').value.trim(),answer=document.getElementById('answerText').value.trim();if(!front||!answer)return;
 if(cardId){const c=d.cards.find(x=>x.id===cardId);c.front=front;c.answer=answer;c.image=window.currentImage||''}
 else d.cards.push({id:uid(),front,answer,image:window.currentImage||''});
 save();showDeckCards(deckId)}
function deleteCard(deckId,cardId){const d=deckById(deckId);if(!confirm('Удалить эту карточку?'))return;d.cards=d.cards.filter(c=>c.id!==cardId);save();showDeckCards(deckId)}
showTab('decks');
</script>
</body>
</html>
